name: Build workshop docs
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        run: npm i -g @moaw/cli
      - name: Build and update docs
        run: |
          git config --global user.name "SandraAhlgrimm"
          git config --global user.email "sandra.ahlgrimm@microsoft.com"
          ./scripts/repo/build-docs.sh

